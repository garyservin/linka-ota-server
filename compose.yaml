---
services:
  ota:
    # Set the container name
    container_name: linka_ota_server

    # Image published to GHCR by .github/workflows/ci.yml. Releases (vX.Y.Z tags)
    # are deployed automatically, and the deploy writes IMAGE_TAG=X.Y.Z to .env
    # so manual `docker compose up -d` keeps running that release.
    # `latest` is the newest release; `edge` is the latest commit on master.
    image: ghcr.io/garyservin/linka-ota-server:${IMAGE_TAG:-latest}

    # For local development, build from this directory instead:
    #   docker compose up -d --build
    build: .

    command: bash -c "gunicorn --bind $${BIND_INTERFACE}:$${CONTAINER_PORT} --graceful-timeout $${GRACEFUL_TIMEOUT} --timeout $${TIMEOUT} --worker-connections $${WORKER_CONNECTIONS} --workers $${WORKERS} 'linka_ota_server:create_app()'"

    volumes:
      - ./bin/:/app/bin/

    # Host the Flask application on port 5000
    ports:
      - 5000:5000

    # Configure the environment
    environment:
      - BIND_INTERFACE=${BIND_INTERFACE:-0.0.0.0}
      - CONTAINER_PORT=${CONTAINER_PORT:-5000}
      - GRACEFUL_TIMEOUT=${GRACEFUL_TIMEOUT:-300}
      - TIMEOUT=${TIMEOUT:-300}
      - WORKER_CONNECTIONS=${WORKER_CONNECTIONS:-5}
      - WORKERS=${WORKERS:-3}
      - FIRMWARE_PATH=/app/bin

    develop:
      # Create a `watch` configuration to update the app
      # https://docs.docker.com/compose/file-watch/#compose-watch-versus-bind-mounts
      watch:
        # Sync the working directory with the `/app` directory in the container
        - action: sync
          path: .
          target: /app
          # Exclude the project virtual environment — it could be for a
          # different platform in the container
          ignore:
            - .venv/

        # Rebuild the image if dependencies change by checking uv.lock
        - action: rebuild
          path: ./uv.lock
