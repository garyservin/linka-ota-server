[project]
name = "linka-ota-server"
version = "0.2.0"
description = "Remote OTA Server for Linka Sensors using linka-firmware"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask",
    "gunicorn",
]

[tool.black]
line-length = 88

[tool.flake8]
max-line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["linka_ota_server"]

[dependency-groups]
dev = [
    "coverage>=7.7.1",
    "pytest>=8.3.5",
]
