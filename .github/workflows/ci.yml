name: CI/CD

# Pull requests: run tests and check that the Docker image builds.
# Push to master: tests -> publish image to GHCR as `edge` + `sha-<commit>` (no deploy).
# Tag vX.Y.Z:     tests + release checks -> publish `X.Y.Z`, `X.Y`, `latest` -> deploy X.Y.Z.
#
# The git tag is the version (no version bump commit needed). To release:
#   gh release create vX.Y.Z --target master --generate-notes
on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release run half-way through a deploy
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # Full history so release checks can verify the tag is on master
          fetch-depth: 0

      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Must be semver, or no X.Y.Z image would be published to deploy
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version tag like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on master"
            exit 1
          fi
          echo "Releasing version ${GITHUB_REF_NAME#v}"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.6.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked --dev

      - name: Run tests with coverage
        run: uv run coverage run -m pytest && uv run coverage report && uv run coverage xml

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          # Releases report X.Y.Z; any other build reports sha-<short commit>
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # 1.2.3, 1.2, latest -> from v1.2.3 git tags (latest = newest release)
          # edge               -> latest commit on master (not deployed)
          # sha-<sha>          -> every build, to trace an image back to its commit
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=master
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker
    # Only release tags deploy; pull requests never reach the self-hosted runner
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /home/gary/linka/linka-ota-server
      IMAGE_TAG: ${{ needs.docker.outputs.version }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image and restart service
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose pull ota
          docker compose up -d --no-build --wait ota

      - name: Health check
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          # Fails if compose.yaml on the server is outdated and ignores IMAGE_TAG
          running=$(docker inspect "$(docker compose ps -q ota)" --format '{{.Config.Image}}')
          if [ "$running" != "$IMAGE:$IMAGE_TAG" ]; then
            echo "Running image is '$running', expected '$IMAGE:$IMAGE_TAG'. Is compose.yaml on the server up to date?"
            exit 1
          fi
          # Wait for /version to answer with the version being deployed
          for i in $(seq 1 10); do
            reported=$(docker compose exec -T ota python -c "import json, urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:5000/version'))['version'])" 2>/dev/null || true)
            if [ "$reported" = "$IMAGE_TAG" ]; then
              echo "Service is up, running version $reported"; exit 0
            fi
            sleep 3
          done
          echo "Service did not report version $IMAGE_TAG (got '$reported')"
          docker compose logs --tail 50 ota
          exit 1

      - name: Pin deployed version in .env
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          # So a manual `docker compose up -d` keeps running this release
          touch .env
          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env
          else
            echo "IMAGE_TAG=$IMAGE_TAG" >> .env
          fi
          grep '^IMAGE_TAG=' .env

      - name: Remove old images
        if: always()
        run: docker image prune -f
